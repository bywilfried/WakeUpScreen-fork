name: Build test APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build WakeUpScreen Fork APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: notification-grace-period

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p build-apk
          cp app/build/outputs/apk/debug/app-debug.apk build-apk/WakeUpScreen-Fork.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WakeUpScreen-Fork-APK
          path: build-apk/WakeUpScreen-Fork.apk
          retention-days: 7
